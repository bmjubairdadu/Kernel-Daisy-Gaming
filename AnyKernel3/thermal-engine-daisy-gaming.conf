# thermal-engine-daisy-gaming.conf
# Kernel Daisy for Gaming - Advanced Thermal Engine
# Device: Mi A2 Lite (daisy) - Snapdragon 625
# Goal: Stay cool (38-40°C) while sustaining gaming performance
# Stock throttles hard at 43-45°C -> Gaming kernel smooth throttle 42-48°C

# Disable stock thermal-engine hard throttle, use gradual steps
[SS-CPU0]
algo_type ss
sampling 1000
sensor xo_therm
device cluster0
set_point 42000
set_point_clr 38000
time_constant 0

[SS-CPU1]
algo_type ss
sampling 1000
sensor xo_therm
device cluster1
set_point 42000
set_point_clr 38000

[GPU-SS]
algo_type ss
sampling 1000
sensor gpu_therm
device gpu
set_point 42000
set_point_clr 39000

# Battery protection - max 42C (stock 45C for cooler surface)
[BATTERY-SS]
algo_type ss
sampling 5000
sensor battery
device battery
set_point 42000
set_point_clr 40000

# Skin thermal - prevent hot surface
[SKIN-MONITOR]
algo_type monitor
sampling 1000
sensor skin_therm
thresholds 38000 42000 45000
thresholds_clr 36000 40000 43000
actions cluster0+cluster1+gpu battery
action_info 1800000+1800000+650000 1400000+1400000+500000 1200000+1200000+400000

# CPU cluster0 (little - 8x Cortex-A53 @1.8GHz)
# Gradual throttling: 1.8GHz -> 1.6GHz -> 1.4GHz -> 1.2GHz
[CPU0_MONITOR]
algo_type monitor
sampling 1000
sensor xo_therm
thresholds 42000 45000 48000 52000
thresholds_clr 40000 43000 46000 50000
actions cluster0
action_info 1800000 1600000 1400000 1200000

# CPU cluster1 same as cluster0 (SD625 has single cluster but keep for compat)
[CPU1_MONITOR]
algo_type monitor
sampling 1000
sensor xo_therm
thresholds 42000 45000 48000 52000
thresholds_clr 40000 43000 46000 50000
actions cluster1
action_info 1800000 1600000 1400000 1200000

# GPU - Adreno 506 - gradual
# 725MHz(OC) -> 650 -> 550 -> 450 -> 320 MHz
[GPU_MONITOR]
algo_type monitor
sampling 1000
sensor gpu_therm
thresholds 40000 43000 46000 50000
thresholds_clr 38000 41000 44000 48000
actions gpu
action_info 650000000 550000000 450000000 320000000

# Charging - reduce current when hot
[CHARGE_MONITOR]
algo_type monitor
sampling 5000
sensor battery
thresholds 40000 43000
thresholds_clr 38000 41000
actions battery
action_info 1500000 1000000

# Virtual sensor - use xo_therm as skin approximation if no skin sensor
[SKIN_VIRTUAL]
algo_type virtual
sampling 1000
sensors xo_therm battery
weights 70 30
